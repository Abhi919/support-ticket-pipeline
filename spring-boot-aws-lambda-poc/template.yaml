AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: POC — Spring Boot on Lambda behind HTTP API (Serverless Java Container)

Globals:
  Function:
    Timeout: 20
    MemorySize: 1024
    Runtime: java17
    Architectures:
      - x86_64

Resources:
  SpringBootApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.example.awslambda.StreamLambdaHandler::handleRequest
      CodeUri: target/spring-boot-aws-lambda-poc-1.0.0-SNAPSHOT.jar
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

Outputs:
  HttpApiUrl:
    Description: Base URL for the implicit HTTP API created by SAM
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
